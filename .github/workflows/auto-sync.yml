name: Auto-Sync Documentation

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-sync-line-documentation
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        # actions/checkout v5
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Set up Python
        # actions/setup-python v6
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Run tests before synchronization
        run: python3 -m unittest discover -s tests -v

      - name: Synchronize and validate documentation
        run: |
          bash scripts/sync-docs.sh
          python3 scripts/validate_repository.py
          python3 scripts/run_skill_evals.py

      - name: Commit synchronized snapshot
        run: |
          if [[ -z "$(git status --porcelain -- references)" ]]; then
            echo "Documentation snapshot is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add references
          git commit -m "chore: sync LINE documentation snapshot"
          git push origin HEAD:main
